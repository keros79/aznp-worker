name = "aznp-proxy"
main = "src/worker.js"
compatibility_date = "2024-09-23"

# ─── 환경 변수 ────────────────────────────────────────────────────────────────
[vars]
# 업그레이드 페이지 URL
UPGRADE_URL = "https://aznp.pages.dev/pricing"
# Solana 수신 지갑 및 온체인 결제 바인딩
SERVICE_WALLET_ADDRESS = "GuUdPHj3dnafbFvF2gMscCVAMCd4NvSE5ktsrbdAvT4E"
SOLANA_RPC_URL = "https://api.mainnet-beta.solana.com"
USDC_MINT_ADDRESS = "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v"
X402_PRICE_USDC = "0.00166"
X402_NETWORK = "solana"
# Base (EVM L2) 수신 지갑 및 온체인 결제 바인딩
BASE_CHAIN_ID = "8453"
BASE_RPC_URL = "https://mainnet.base.org"
BASE_USDC_ADDRESS = "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913"
BASE_SERVICE_WALLET_ADDRESS = "0x22E2076148c529981495c3C02A23DfB1D4f8Db9C"

# ─── KV Namespace 바인딩 ──────────────────────────────────────────────────────
[[kv_namespaces]]
binding = "RESULTS_KV"
id = "45301c3029b84f90830d7275c01a311c"

# Pro API Key 저장소
[[kv_namespaces]]
binding = "API_KEYS"
id = "15e38ac172464389bd646a225c8c0552"

# ─── D1 Database 바인딩 ────────────────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "aznp-analytics"
database_id = "5ad6d12d-4121-4120-a4b4-bba3f5db93e3"

# ─── Browser Rendering 바인딩 (Pro Tier 3) ────────────────────────────
[browser]
binding = "BROWSER"

# ─── 개발 환경 ────────────────────────────────────────────────────────────────
[dev]
port = 8787
local_protocol = "http"

# ─── 프로덕션 환경 (preview 배포용) ──────────────────────────────────────────
